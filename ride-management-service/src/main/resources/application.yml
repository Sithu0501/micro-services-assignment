server:
  port: ${PORT:8083}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  config:
    # Loads KEY=VALUE pairs from the git-ignored .env file in the service directory (if present).
    import: optional:file:.env[.properties]
  application:
    name: ride-management-service
  data:
    mongodb:
      # Required: set RIDE_MONGODB_URI in the environment or .env (never commit real credentials).
      uri: ${RIDE_MONGODB_URI}
      database: ridelink_ride_db
      auto-index-creation: true

services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  driver:
    url: ${DRIVER_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

jwt:
  # Required: shared HMAC-SHA256 secret (minimum 32 characters) matching Account Service, via JWT_SECRET or .env.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# Springdoc OpenAPI / Swagger UI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    urls:
      - name: "1. Account Service (Port 8081)"
        url: http://localhost:8081/v3/api-docs
      - name: "2. Driver & Vehicle Service (Port 8082)"
        url: http://localhost:8082/v3/api-docs
      - name: "3. Ride Management Service (Port 8083)"
        url: /v3/api-docs
    urls-primary-name: "3. Ride Management Service (Port 8083)"

logging:
  level:
    root: INFO
    com.ridelink.ridemanagement: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
