server:
  port: 8083

spring:
  application:
    name: ride-management-service-test
  data:
    mongodb:
      uri: mongodb://localhost:27017/ridelink_ride_test
      database: ridelink_ride_db
      auto-index-creation: false

services:
  account:
    url: http://localhost:8081
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
  driver:
    url: http://localhost:8082
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
  payment:
    url: http://localhost:8084
    connect-timeout-ms: 1000
    read-timeout-ms: 1000

jwt:
  secret: test-only-jwt-secret-not-for-production-use-0123456789
  expiration: 86400000

logging:
  level:
    root: WARN
    com.ridelink.ridemanagement: INFO
