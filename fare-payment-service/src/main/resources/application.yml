server:
  port: ${PORT:8084}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  config:
    # Loads KEY=VALUE pairs from the git-ignored .env file in the service directory (if present).
    import: optional:file:.env[.properties], optional:file:../.env[.properties]
  application:
    name: fare-payment-service
  data:
    mongodb:
      # Required: set PAYMENT_MONGODB_URI in the environment or .env (never commit real credentials).
      uri: ${PAYMENT_MONGODB_URI}
      database: ${PAYMENT_DB_NAME:ridelink_payment_db}
      auto-index-creation: true

services:
  ride:
    url: ${RIDE_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

jwt:
  # Required: shared HMAC-SHA256 secret (minimum 32 characters) matching Account Service, via JWT_SECRET or .env.
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

logging:
  level:
    root: INFO
    com.ridelink.fare_payment_service: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
