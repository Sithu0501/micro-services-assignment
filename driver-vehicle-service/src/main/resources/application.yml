server:
  port: ${PORT:8082}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  config:
    # Loads KEY=VALUE pairs from the git-ignored .env file in the service directory (if present).
    import: optional:file:.env[.properties]
  application:
    name: driver-vehicle-service
  data:
    mongodb:
      # Required: set MONGODB_URI in the environment or .env (never commit real credentials).
      uri: ${MONGODB_URI}
      database: ridelink_driver_db
      auto-index-creation: true

jwt:
  # Required: HMAC-SHA256 secret (minimum 32 characters) supplied via the JWT_SECRET environment variable or .env.
  secret: ${JWT_SECRET}
  # Expiration in milliseconds: default 86400000 ms (24 hours)
  expiration: ${JWT_EXPIRATION:86400000}

# Springdoc OpenAPI / Swagger UI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    urls:
      - name: "1. Account Service (User Management - Port 8081)"
        url: http://localhost:8081/v3/api-docs
      - name: "2. Driver & Vehicle Service (Port 8082)"
        url: /v3/api-docs
    urls-primary-name: "2. Driver & Vehicle Service (Port 8082)"

logging:
  level:
    root: INFO
    com.ridelink.drivervehicleservice: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
